# This workflow publishes npm packages via npm Trusted Publishing (OIDC).
name: Publish npm Package

on:
  push:
    branches:
      - master
      - v2

jobs:
  build:
    runs-on: ubuntu-latest
    # Must match the environment configured in npm Trusted Publisher settings.
    environment: PUBLISH_NPM_REGISTRY_TOKEN
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # npm Trusted Publishing requires modern Node/npm versions.
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm -r install

      - name: Type Check UIKit
        run: pnpm --filter @tidbcloud/uikit type-check

      - name: Build Package
        run: pnpm -r build

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          commit: 'release: bump versions'
          title: 'release: bump versions'
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
